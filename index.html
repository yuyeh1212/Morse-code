<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>摩斯密碼翻譯器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="panels">
      <div class="panel">
        <h3>Morse Code Translation</h3>
        <h1>摩斯密碼翻譯器</h1>
        <textarea id="input" rows="4" placeholder="請輸入英文、數字或符號">
HELLO WORLD</textarea
        >
        <button
          type="button"
          class="symbol"
          id="btnSwap"
          title="交換上下內容"
          aria-label="交換上下內容"
        >
          ⇵
        </button>
        <textarea id="output" rows="4" placeholder="請輸入摩斯密碼"></textarea>
        <div class="error-message" id="errorMsg"></div>
        <div class="playlist" id="playlist"></div>
        <div class="buttons">
          <button class="purple" id="btnTranslate">翻譯成密碼</button>
          <button class="white" id="btnPlay">播放</button>
          <button class="red" id="btnStop" style="display: none">停止</button>
          <button class="white" id="btnCopy">複製</button>
        </div>
        <audio
          id="shortBeep"
          src="https://2017.awiclass.monoame.com/audio/morse/short.mp3"
        ></audio>
        <audio
          id="longBeep"
          src="https://2017.awiclass.monoame.com/audio/morse/long.mp3"
        ></audio>
      </div>

      <div class="panel yellow">
        <h3>翻譯清單</h3>
        <hr />
        <ul class="translist" id="translist"></ul>
      </div>

      <div class="decoration">MORSE CODE</div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
