<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>摩斯密碼翻譯器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="panels">
      <div class="panel">
        <h3>Morse Code Translation</h3>
        <h1>摩斯密碼翻譯器</h1>
        <textarea id="input" rows="4" placeholder="請輸入英文">
MORSECODE</textarea
        >
        <div class="symbol">⇵</div>
        <textarea id="output" rows="4" placeholder="請輸入密碼"></textarea>
        <div class="playlist"></div>
        <div class="buttons">
          <button class="purple" id="btnMorse">翻譯成密碼</button>
          <button class="yellow" id="btnEng">翻譯成英文</button>
          <button class="white" id="btnPlay">播放</button>
        </div>
        <audio
          class="short"
          src="https://2017.awiclass.monoame.com/audio/morse/short.mp3"
        ></audio>
        <audio
          class="long"
          src="https://2017.awiclass.monoame.com/audio/morse/long.mp3"
        ></audio>
      </div>

      <div class="panel yellow">
        <h3>翻譯清單</h3>
        <hr />
        <ul class="translist"></ul>
      </div>

      <div class="decoration">MORSE CODE</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/velocity/2.0.6/velocity.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
